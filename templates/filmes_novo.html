{% extends 'base.html' %}

{% block titulo %}Cadastro de Filme — CineLocadora{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">🎞️ Novo Filme</h4>
      </div>
      <div class="card-body">

        <form action="{{ url_for('filme_novo') }}" method="post">

          <div class="mb-3">
            <label for="titulo" class="form-label">Título <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="titulo" name="titulo"
                   placeholder="Ex.: Matrix"
                   value="{{ dados.titulo | default('') }}">
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="genero" class="form-label">Gênero <span class="text-danger">*</span></label>
              <select class="form-select" id="genero" name="genero">
                <option value="">-- Selecione --</option>
                {% for g in generos %}
                  <option value="{{ g }}" {% if dados.genero == g %}selected{% endif %}>{{ g }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label for="ano" class="form-label">Ano de lançamento <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="ano" name="ano"
                     placeholder="Ex.: 1999"
                     value="{{ dados.ano | default('') }}">
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="duracao" class="form-label">Duração (minutos) <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="duracao" name="duracao"
                     placeholder="Ex.: 136"
                     value="{{ dados.duracao | default('') }}">
            </div>
            <div class="col-md-6 mb-3">
              <label for="valor_diaria" class="form-label">Valor da diária (R$) <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="valor_diaria" name="valor_diaria"
                     placeholder="Ex.: 8.90"
                     value="{{ dados.valor_diaria | default('') }}">
            </div>
          </div>

          <div class="mb-3">
            <label for="sinopse" class="form-label">Sinopse</label>
            <textarea class="form-control" id="sinopse" name="sinopse" rows="4"
                      placeholder="Resumo do filme">{{ dados.sinopse | default('') }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">✔ Cadastrar</button>
            <a href="{{ url_for('filmes_lista') }}" class="btn btn-outline-secondary">Ver filmes</a>
            <a href="{{ url_for('pagina_inicial') }}" class="btn btn-outline-danger">✖ Cancelar</a>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
