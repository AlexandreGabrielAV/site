{% extends 'base.html' %}

{% block titulo %}Cadastro de Usuário — CineLocadora{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">👤 Novo Usuário</h4>
      </div>
      <div class="card-body">

        <form action="{{ url_for('usuario_novo') }}" method="post">

          <div class="mb-3">
            <label for="nome" class="form-label">Nome completo <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="nome" name="nome"
                   placeholder="Digite o nome completo"
                   value="{{ dados.nome | default('') }}">
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">E-mail <span class="text-danger">*</span></label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="seu@email.com"
                   value="{{ dados.email | default('') }}">
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="senha" class="form-label">Senha <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="senha" name="senha"
                     placeholder="Mínimo de 6 caracteres">
            </div>
            <div class="col-md-6 mb-3">
              <label for="confirmar" class="form-label">Confirmar senha <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="confirmar" name="confirmar"
                     placeholder="Repita a senha">
            </div>
          </div>

          <div class="mb-3">
            <label for="cidade" class="form-label">Cidade <span class="text-danger">*</span></label>
            <select class="form-select" id="cidade" name="cidade">
              <option value="">-- Selecione --</option>
              {% for c in cidades %}
                <option value="{{ c }}" {% if dados.cidade == c %}selected{% endif %}>{{ c }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Perfil de acesso</label>
            <div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="perfil" id="perfil_cliente"
                       value="cliente"
                       {% if dados.perfil | default('cliente') == 'cliente' %}checked{% endif %}>
                <label class="form-check-label" for="perfil_cliente">Cliente</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="perfil" id="perfil_funcionario"
                       value="funcionario"
                       {% if dados.perfil == 'funcionario' %}checked{% endif %}>
                <label class="form-check-label" for="perfil_funcionario">Funcionário</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="perfil" id="perfil_admin"
                       value="admin"
                       {% if dados.perfil == 'admin' %}checked{% endif %}>
                <label class="form-check-label" for="perfil_admin">Administrador</label>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">✔ Cadastrar</button>
            <a href="{{ url_for('usuarios_lista') }}" class="btn btn-outline-secondary">Ver usuários</a>
            <a href="{{ url_for('pagina_inicial') }}" class="btn btn-outline-danger">✖ Cancelar</a>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
